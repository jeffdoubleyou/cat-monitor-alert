services:
  cat-monitor:
    build: .
    container_name: cat-monitor-alert
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./snapshots:/app/snapshots
    # Host networking makes LAN cameras reachable and binds the UI on the host
    # (UI_HOST=0.0.0.0, UI_PORT=8787 by default).
    network_mode: host
